server:
  address: 0.0.0.0:8000
  model: release
  enableSwagger: false

db:
  dialects: mysql
  host: mysql
  port: 3306
  db: devops
  username: root
  password: ""
  charset: utf8mb4
  maxIdle: 50
  maxOpen: 150

redis:
  address: redis:6379
  password: ""

imageSettings:
  uploadDir: ./upload/
  imageHost: http://localhost:8080

log:
  path: ./log
  name: sys
  model: console

monitor:
  prometheus:
    url: "http://prometheus:9090"
  pushgateway:
    url: "http://pushgateway:9091"
  agent:
    heartbeat_server_url: "http://devops-api:8000/api/v1/monitor/agent/heartbeat"
    heartbeat_token: ""
  webhook:
    token: ""

windows_exporter:
  installer_base_url: "http://devops-api:8000/api/v1/upload/"
  default_version: "0.31.3"
  default_port: 9182
  enabled_collectors: "cpu,cs,logical_disk,net,os,system,service,memory,process"
  push_mode:
    enabled: true
    interval: 60
    pushgateway_url: "http://pushgateway:9091"

ai:
  enabled: false
  provider: openai
  baseUrl: https://api.openai.com/v1
  apiKey: ""
  model: gpt-5.4
  reasoningEffort: medium
  timeoutSeconds: 60
