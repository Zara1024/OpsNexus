# 项目启动端口
server:
  address: 0.0.0.0:8000
  model: release
  enableSwagger: false

# 数据库配置
db:
  dialects: mysql
  host: mysql
  port: 3306
  db: devops
  username: root
  password: ""
  charset: utf8
  maxIdle: 50
  maxOpen: 150

# Redis 配置
redis:
  address: redis:6379
  password: ""

# 图片与上传配置
imageSettings:
  uploadDir: ./upload/
  imageHost: http://localhost:8080

# 日志配置
log:
  path: ./log
  name: sys
  model: console

# 监控配置
monitor:
  prometheus:
    url: "http://prometheus:9090"
  pushgateway:
    url: "http://pushgateway:9091"
  agent:
    heartbeat_server_url: "http://devops-api:8000/api/v1/monitor/agent/heartbeat"
    heartbeat_token: ""
  webhook:
    token: ""

# Windows Exporter 配置
windows_exporter:
  installer_base_url: "http://devops-api:8000/api/v1/upload/"
  default_version: "0.31.3"
  default_port: 9182
  enabled_collectors: "cpu,cs,logical_disk,net,os,system,service,memory,process"
  push_mode:
    enabled: true
    interval: 60
    pushgateway_url: "http://pushgateway:9091"
