services:
  mysql:
    image: mysql:8.0.33
    container_name: opsnexus-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in docker/.env}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST:-%}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devops}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./mysql/devops001.sql:/docker-entrypoint-initdb.d/01-devops.sql:ro
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/02-init.sql:ro
      - ./mysql/conf.d:/etc/mysql/conf.d:ro
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - opsnexus-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  redis:
    image: redis:7.0-alpine
    container_name: opsnexus-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}
    volumes:
      - ./redis/data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - opsnexus-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: opsnexus-pushgateway
    restart: unless-stopped
    user: root
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./pushgateway/data:/pushgateway
    networks:
      - opsnexus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: opsnexus-prometheus
    restart: unless-stopped
    user: root
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    networks:
      - opsnexus-network
    depends_on:
      pushgateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.27.0
    container_name: opsnexus-alertmanager
    restart: unless-stopped
    profiles:
      - alerting
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MONITOR_WEBHOOK_TOKEN: ${MONITOR_WEBHOOK_TOKEN:?set MONITOR_WEBHOOK_TOKEN in docker/.env}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/data:/alertmanager
    entrypoint:
      - /bin/sh
      - -ec
    command: |
      sed "s|__MONITOR_WEBHOOK_TOKEN__|$${MONITOR_WEBHOOK_TOKEN}|g" /etc/alertmanager/alertmanager.yml > /tmp/alertmanager.yml
      exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    networks:
      - opsnexus-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  devops-api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    image: opsnexus-local/devops-api:latest
    container_name: opsnexus-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      IMAGE_HOST: ${IMAGE_HOST:?set IMAGE_HOST in docker/.env}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-devops}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in docker/.env}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in docker/.env}
      MONITOR_PROMETHEUS_URL: ${MONITOR_PROMETHEUS_URL:-http://prometheus:9090}
      MONITOR_PUSHGATEWAY_URL: ${MONITOR_PUSHGATEWAY_URL:-http://pushgateway:9091}
      MONITOR_AGENT_HEARTBEAT_SERVER_URL: ${MONITOR_AGENT_HEARTBEAT_SERVER_URL:-http://devops-api:8000/api/v1/monitor/agent/heartbeat}
      MONITOR_AGENT_HEARTBEAT_TOKEN: ${MONITOR_AGENT_HEARTBEAT_TOKEN:?set MONITOR_AGENT_HEARTBEAT_TOKEN in docker/.env}
      MONITOR_WEBHOOK_TOKEN: ${MONITOR_WEBHOOK_TOKEN:?set MONITOR_WEBHOOK_TOKEN in docker/.env}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.4}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-medium}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
    volumes:
      - ./api/config.yaml:/app/config.yaml:ro
      - ./api/logs:/app/log
      - ./api/upload:/app/upload
      - ../api/upload/xlsl/host.xlsx:/app/upload/xlsl/host.xlsx:ro
      - ./api/ssh_keys:/root/.ssh:ro
    networks:
      - opsnexus-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/api/v1/captcha >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  devops-web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    image: opsnexus-local/devops-web:latest
    container_name: opsnexus-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./web/devops.conf:/etc/nginx/conf.d/default.conf:ro
      - ./api/upload:/home/devops/upload:ro
    networks:
      - opsnexus-network
    depends_on:
      devops-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  opsnexus-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
