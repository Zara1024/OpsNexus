services:
  # MySQL database service
  mysql:
    image: mysql:8.0.33
    container_name: devops-mysql
    restart: always
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
      MYSQL_ROOT_HOST: ${MYSQL_ROOT_HOST:-%}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-devops}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Persistent data directory
      - ./mysql/data:/var/lib/mysql
      # Initialization SQL scripts (executed in alphabetical order)
      - ./mysql/devops001.sql:/docker-entrypoint-initdb.d/01-devops.sql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/02-init.sql
      # MySQL configuration
      - ./mysql/conf.d:/etc/mysql/conf.d
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-CHANGE_ME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache service
  redis:
    image: redis:7.0-alpine
    container_name: devops-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-CHANGE_ME} --appendonly yes
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Persistent data directory
      - ./redis/data:/data
      # Redis configuration
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-CHANGE_ME}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Optional Alertmanager service for P1 alert center acceptance
  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.27.0
    container_name: devops-alertmanager
    restart: always
    profiles:
      - p1-alerting
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./alertmanager/data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Pushgateway metrics push service
  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: devops-pushgateway
    restart: always
    user: root
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Persistent data
      - ./pushgateway/data:/pushgateway
    networks:
      - devops-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9091/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  # Prometheus monitoring service
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: devops-prometheus
    restart: always
    user: root
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Prometheus configuration
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      # Persistent data directory
      - ./prometheus/data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - devops-network
    depends_on:
      pushgateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5

  # DevOps API backend service
  devops-api:
    build:
      context: ..
      dockerfile: docker/api/Dockerfile
    image: opsnexus-local/devops-api:latest
    container_name: devops-api
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      # 传递环境变量到容器(供应用读取)
      IMAGE_HOST: ${IMAGE_HOST:-http://localhost:8080}
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${MYSQL_DATABASE:-devops}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_ME}
      MONITOR_PROMETHEUS_URL: ${MONITOR_PROMETHEUS_URL:-http://prometheus:9090}
      MONITOR_PUSHGATEWAY_URL: ${MONITOR_PUSHGATEWAY_URL:-http://pushgateway:9091}
      MONITOR_AGENT_HEARTBEAT_SERVER_URL: ${MONITOR_AGENT_HEARTBEAT_SERVER_URL:-http://devops-api:8000/api/v1/monitor/agent/heartbeat}
      MONITOR_AGENT_HEARTBEAT_TOKEN: ${MONITOR_AGENT_HEARTBEAT_TOKEN:-CHANGE_ME}
      MONITOR_WEBHOOK_TOKEN: ${MONITOR_WEBHOOK_TOKEN:-CHANGE_ME}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-5.4}
      AI_REASONING_EFFORT: ${AI_REASONING_EFFORT:-medium}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
    volumes:
      # Configuration file
      - ./api/config.yaml:/app/config.yaml
      # Logs directory
      - ./api/logs:/app/log
      # Upload files directory
      - ./api/upload:/app/upload
      # Excel template file
      - ./api/upload/host.xlsx:/app/upload/xlsl/host.xlsx
      # SSH keys (persistent across container restarts)
      - ./api/ssh_keys:/root/.ssh:ro
    networks:
      - devops-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    # 禁用健康检查,API 已正常启动
    # healthcheck:
    #   test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 10
    #   start_period: 30s

  # DevOps Web frontend service
  devops-web:
    build:
      context: ..
      dockerfile: docker/web/Dockerfile
    image: opsnexus-local/devops-web:latest
    container_name: devops-web
    restart: always
    ports:
      - "${WEB_PORT:-8080}:80"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      # Nginx configuration
      - ./web/devops.conf:/etc/nginx/conf.d/default.conf
      # Upload files static service (shared with API)
      - ./api/upload:/home/devops/upload
    networks:
      - devops-network
    depends_on:
      - devops-api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:80"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  devops-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  pushgateway-data:
