# Overlay values for deploy/helm/opsnexus
# Usage:
#   helm upgrade --install opsnexus ./deploy/helm/opsnexus \
#     -n opsnexus --create-namespace \
#     -f ./deploy/helm/values-alerting.example.yaml

api:
  monitor:
    agentHeartbeatToken: agent-heartbeat-token-2024
    webhookToken: webhook-notify-token-2024

prometheus:
  alerting:
    enabled: true

alertmanager:
  enabled: true

