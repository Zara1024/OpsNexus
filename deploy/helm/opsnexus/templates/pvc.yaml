{{- if and .Values.api.enabled .Values.api.persistence.enabled (not .Values.api.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ printf "%s-data" (include "opsnexus.componentFullname" (dict "root" . "component" "api")) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "opsnexus.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.api.persistence.accessModes | nindent 4 }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.size }}
  {{- include "opsnexus.storageClass" (dict "root" . "componentStorageClass" .Values.api.persistence.storageClass) | nindent 2 }}
---
{{- end }}
