{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsnexus.componentFullname" (dict "root" . "component" "api") }}
  labels:
    {{- include "opsnexus.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "opsnexus.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opsnexus.componentSelectorLabels" (dict "root" . "component" "api") | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap-api.yaml") . | sha256sum }}
        checksum/assets: {{ include (print $.Template.BasePath "/configmap-api-assets.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret-api.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "opsnexus.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: init-upload-dir
          image: "{{ .Values.api.initContainer.image.repository }}:{{ .Values.api.initContainer.image.tag }}"
          imagePullPolicy: {{ .Values.api.initContainer.image.pullPolicy }}
          command:
            - sh
            - -c
            - mkdir -p /app/upload/xlsl /app/log
          volumeMounts:
            - name: api-data
              mountPath: /app/upload
            - name: api-data
              mountPath: /app/log
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ default .Values.global.defaultImagePullPolicy .Values.api.image.pullPolicy }}
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
            - name: DB_HOST
              value: {{ include "opsnexus.apiDbHost" . | quote }}
            - name: DB_PORT
              value: {{ include "opsnexus.apiDbPort" . | quote }}
            - name: DB_NAME
              value: {{ include "opsnexus.apiDbName" . | quote }}
            - name: DB_USER
              value: {{ include "opsnexus.apiDbUser" . | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsnexus.mysqlSecretName" . }}
                  key: {{ include "opsnexus.apiDbPasswordSecretKey" . }}
            - name: REDIS_ADDR
              value: {{ include "opsnexus.apiRedisAddress" . | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsnexus.redisSecretName" . }}
                  key: {{ include "opsnexus.apiRedisPasswordSecretKey" . }}
            - name: MONITOR_PROMETHEUS_URL
              value: {{ include "opsnexus.apiPrometheusURL" . | quote }}
            - name: MONITOR_PUSHGATEWAY_URL
              value: {{ include "opsnexus.apiPushgatewayURL" . | quote }}
            - name: MONITOR_AGENT_HEARTBEAT_SERVER_URL
              value: {{ include "opsnexus.apiHeartbeatServerURL" . | quote }}
            - name: MONITOR_AGENT_HEARTBEAT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsnexus.apiSecretName" . }}
                  key: {{ .Values.api.existingSecretKeys.agentHeartbeatToken }}
            - name: MONITOR_WEBHOOK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "opsnexus.apiSecretName" . }}
                  key: {{ .Values.api.existingSecretKeys.webhookToken }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: api-config
              mountPath: /app/config.yaml
              subPath: config.yaml
            - name: api-data
              mountPath: /app/log
            - name: api-data
              mountPath: /app/upload
            - name: api-assets
              mountPath: /app/upload/xlsl/host.xlsx
              subPath: host.xlsx
            {{- if .Values.api.sshKeysSecret.name }}
            - name: ssh-keys
              mountPath: /root/.ssh
              readOnly: true
            {{- end }}
          {{- if .Values.api.startupProbe.enabled }}
          startupProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.api.startupProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.startupProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.startupProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.startupProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.api.livenessProbe.enabled }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.livenessProbe.failureThreshold }}
          {{- end }}
          {{- if .Values.api.readinessProbe.enabled }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.api.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.api.readinessProbe.failureThreshold }}
          {{- end }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: api-config
          secret:
            secretName: {{ printf "%s-config" (include "opsnexus.componentFullname" (dict "root" . "component" "api")) | trunc 63 | trimSuffix "-" }}
        - name: api-assets
          configMap:
            name: {{ printf "%s-assets" (include "opsnexus.componentFullname" (dict "root" . "component" "api")) | trunc 63 | trimSuffix "-" }}
        - name: api-data
          {{- if .Values.api.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "opsnexus.componentFullname" (dict "root" . "component" "api")) | trunc 63 | trimSuffix "-") .Values.api.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.api.sshKeysSecret.name }}
        - name: ssh-keys
          secret:
            secretName: {{ .Values.api.sshKeysSecret.name }}
        {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
