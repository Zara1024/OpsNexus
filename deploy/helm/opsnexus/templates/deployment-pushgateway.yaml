{{- if .Values.pushgateway.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsnexus.componentFullname" (dict "root" . "component" "pushgateway") }}
  labels:
    {{- include "opsnexus.componentLabels" (dict "root" . "component" "pushgateway") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "opsnexus.componentSelectorLabels" (dict "root" . "component" "pushgateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opsnexus.componentSelectorLabels" (dict "root" . "component" "pushgateway") | nindent 8 }}
        {{- with .Values.pushgateway.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.pushgateway.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "opsnexus.serviceAccountName" . }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pushgateway.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: pushgateway
          image: "{{ .Values.pushgateway.image.repository }}:{{ .Values.pushgateway.image.tag }}"
          imagePullPolicy: {{ default .Values.global.defaultImagePullPolicy .Values.pushgateway.image.pullPolicy }}
          {{- with .Values.pushgateway.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          args:
            - --web.listen-address=:{{ .Values.pushgateway.service.port }}
            {{- if .Values.pushgateway.persistence.enabled }}
            - --persistence.file={{ .Values.pushgateway.persistence.file }}
            - --persistence.interval={{ .Values.pushgateway.persistence.interval }}
            {{- end }}
          env:
            - name: TZ
              value: {{ .Values.global.timezone | quote }}
          ports:
            - name: http
              containerPort: 9091
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: pushgateway-data
              mountPath: /pushgateway
          {{- with .Values.pushgateway.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: pushgateway-data
          {{- if .Values.pushgateway.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-data" (include "opsnexus.componentFullname" (dict "root" . "component" "pushgateway")) | trunc 63 | trimSuffix "-") .Values.pushgateway.persistence.existingClaim }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.pushgateway.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pushgateway.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.pushgateway.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

