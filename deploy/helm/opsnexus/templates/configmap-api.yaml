{{- if .Values.api.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-config" (include "opsnexus.componentFullname" (dict "root" . "component" "api")) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "opsnexus.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    server:
      address: {{ .Values.api.config.serverAddress | quote }}
      model: {{ .Values.api.config.model | quote }}
      enableSwagger: {{ .Values.api.config.enableSwagger }}

    db:
      dialects: mysql
      host: {{ include "opsnexus.apiDbHost" . | quote }}
      port: {{ include "opsnexus.apiDbPort" . }}
      db: {{ include "opsnexus.apiDbName" . | quote }}
      username: {{ include "opsnexus.apiDbUser" . | quote }}
      {{- if .Values.mysql.enabled }}
      password: {{ .Values.mysql.auth.rootPassword | quote }}
      {{- else }}
      password: {{ .Values.externalServices.mysql.password | quote }}
      {{- end }}
      charset: {{ .Values.api.config.dbCharset | quote }}
      maxIdle: {{ .Values.api.config.dbMaxIdle }}
      maxOpen: {{ .Values.api.config.dbMaxOpen }}

    redis:
      address: {{ include "opsnexus.apiRedisAddress" . | quote }}
      {{- if .Values.redis.enabled }}
      password: {{ .Values.redis.auth.password | quote }}
      {{- else }}
      password: {{ .Values.externalServices.redis.password | quote }}
      {{- end }}

    imageSettings:
      uploadDir: {{ .Values.api.config.uploadDir | quote }}
      imageHost: {{ .Values.api.config.imageHost | quote }}

    log:
      path: {{ .Values.api.config.logPath | quote }}
      name: {{ .Values.api.config.logName | quote }}
      model: {{ .Values.api.config.logModel | quote }}

    monitor:
      prometheus:
        url: {{ include "opsnexus.apiPrometheusURL" . | quote }}
      pushgateway:
        url: {{ include "opsnexus.apiPushgatewayURL" . | quote }}
      agent:
        heartbeat_server_url: {{ include "opsnexus.apiHeartbeatServerURL" . | quote }}
        heartbeat_token: {{ .Values.api.monitor.agentHeartbeatToken | quote }}
      webhook:
        token: {{ .Values.api.monitor.webhookToken | quote }}
{{- end }}
