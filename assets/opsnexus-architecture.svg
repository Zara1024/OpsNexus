<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020" role="img" aria-labelledby="title desc">
  <title id="title">OpsNexus 项目架构图</title>
  <desc id="desc">OpsNexus code structure and runtime dependency architecture diagram, covering web frontend, Go API platform, business domains, infrastructure dependencies, external integrations, and deployment paths.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="panelGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#fbfdff" stop-opacity="1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#94a3b8" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="10" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#5b6b82"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; }
      .eyebrow { font: 700 12px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #64748b; letter-spacing: 1.4px; text-transform: uppercase; }
      .section { font: 700 22px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .cardTitle { font: 700 18px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .body { font: 500 14px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #334155; }
      .small { font: 500 12px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #64748b; }
      .label { font: 600 13px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; }
      .code { font: 500 13px Consolas,'SFMono-Regular','Courier New',monospace; fill: #1e293b; }
      .legend { font: 600 12px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #334155; }
      .panel { fill: url(#panelGlow); stroke: #dbe5f0; stroke-width: 1.6; }
      .subpanel { fill: #f8fbff; stroke: #dce7f2; stroke-width: 1.2; }
      .footer { font: 500 12px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #64748b; }
      .link { fill: none; stroke: #5b6b82; stroke-width: 2.4; marker-end: url(#arrow); }
      .link-dashed { fill: none; stroke: #7c8aa1; stroke-width: 2.2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .chipText { font: 700 12px 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; fill: #0f172a; }
      .legendLine { fill: none; stroke: #5b6b82; stroke-width: 2.4; }
      .legendDashLine { fill: none; stroke: #7c8aa1; stroke-width: 2.2; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1600" height="1020" fill="url(#bg)"/>
  <circle cx="1460" cy="120" r="120" fill="#dbeafe" opacity="0.35"/>
  <circle cx="1520" cy="880" r="160" fill="#e0f2fe" opacity="0.26"/>
  <circle cx="110" cy="930" r="180" fill="#dbeafe" opacity="0.18"/>

  <text class="title" x="48" y="62">OpsNexus 项目架构图</text>
  <text class="subtitle" x="48" y="91">Code structure + runtime dependencies</text>

  <rect x="1260" y="34" width="292" height="58" rx="16" fill="#ffffff" stroke="#dbe5f0"/>
  <line x1="1284" y1="58" x2="1326" y2="58" class="legendLine"/>
  <text class="legend" x="1338" y="62">runtime / control flow</text>
  <line x1="1284" y1="79" x2="1326" y2="79" class="legendDashLine"/>
  <text class="legend" x="1338" y="83">delivery / deployment path</text>

  <g id="access">
    <rect class="panel" x="40" y="124" width="220" height="168" rx="24" filter="url(#shadow)"/>
    <rect x="40" y="124" width="220" height="8" rx="24" fill="#38bdf8"/>
    <text class="eyebrow" x="64" y="160">Access Layer</text>
    <text class="section" x="64" y="192">User / Browser</text>
    <text class="body" x="64" y="224">Ops, SRE, Dev, DBA</text>
    <text class="body" x="64" y="247">HTTPS portal entry</text>
    <text class="small" x="64" y="274">Login, dashboard, CMDB, K8s, monitor, AI workbench</text>
  </g>

  <g id="delivery">
    <rect class="panel" x="40" y="330" width="220" height="214" rx="24" filter="url(#shadow)"/>
    <rect x="40" y="330" width="220" height="8" rx="24" fill="#fb923c"/>
    <text class="eyebrow" x="64" y="366">Delivery Paths</text>
    <text class="section" x="64" y="398">Deploy &amp; Ship</text>
    <text class="code" x="64" y="430">docker/docker-compose.yml</text>
    <text class="code" x="64" y="456">deploy/helm/opsnexus</text>
    <text class="code" x="64" y="482">k8s/*.yaml</text>
    <text class="code" x="64" y="508">deploy/systemd/*.service</text>
    <text class="code" x="64" y="534">scripts/deploy-systemd-remote.ps1</text>
  </g>

  <g id="repo">
    <rect class="panel" x="40" y="582" width="220" height="186" rx="24" filter="url(#shadow)"/>
    <rect x="40" y="582" width="220" height="8" rx="24" fill="#22c55e"/>
    <text class="eyebrow" x="64" y="618">Repo Anchors</text>
    <text class="cardTitle" x="64" y="648">Key Directories</text>
    <text class="code" x="64" y="680">web/src/{router,api,views}</text>
    <text class="code" x="64" y="706">web/src/{components,utils}</text>
    <text class="code" x="64" y="732">api/router + middleware</text>
    <text class="code" x="64" y="758">api/api/&lt;domain&gt;/{...}</text>
  </g>

  <g id="frontend">
    <rect class="panel" x="300" y="124" width="300" height="258" rx="28" filter="url(#shadow)"/>
    <rect x="300" y="124" width="300" height="8" rx="28" fill="#0ea5e9"/>
    <text class="eyebrow" x="326" y="160">Presentation</text>
    <text class="section" x="326" y="192">Web UI / web/</text>
    <text class="body" x="326" y="224">Vue 3 + Element Plus + Vue Router + Vuex</text>
    <text class="code" x="326" y="260">web/src/router/*.js</text>
    <text class="small" x="326" y="282">navigation tree, auth guard, menu entry</text>
    <text class="code" x="326" y="312">web/src/api/*.js</text>
    <text class="small" x="326" y="334">Axios facade for each backend domain</text>
    <text class="code" x="326" y="364">web/src/views/* + components/ + utils/</text>
  </g>

  <g id="backend">
    <rect class="panel" x="640" y="104" width="400" height="298" rx="28" filter="url(#shadow)"/>
    <rect x="640" y="104" width="400" height="8" rx="28" fill="#6366f1"/>
    <text class="eyebrow" x="668" y="140">Service Platform</text>
    <text class="section" x="668" y="172">API Platform / api/</text>
    <text class="body" x="668" y="204">Go + Gin + GORM, mounted under /api/v1</text>
    <text class="code" x="668" y="240">api/main.go</text>
    <text class="small" x="668" y="262">config load, DB/Redis init, scheduler, HTTP server</text>
    <text class="code" x="668" y="292">api/router/router.go</text>
    <text class="small" x="668" y="314">route aggregation + websocket + middleware chain</text>
    <text class="code" x="668" y="344">api/api/&lt;domain&gt;/{controller,service,dao,model}</text>
    <text class="small" x="668" y="366">controller -> service -> dao/model layered domain implementation</text>
  </g>

  <g id="dependencies">
    <rect class="panel" x="1080" y="124" width="480" height="302" rx="28" filter="url(#shadow)"/>
    <rect x="1080" y="124" width="480" height="8" rx="28" fill="#14b8a6"/>
    <text class="eyebrow" x="1108" y="160">Internal Dependencies</text>
    <text class="section" x="1108" y="192">State, Cache, Metrics</text>
    <rect class="subpanel" x="1108" y="220" width="156" height="76" rx="18"/>
    <rect class="subpanel" x="1278" y="220" width="156" height="76" rx="18"/>
    <rect class="subpanel" x="1448" y="220" width="84" height="76" rx="18"/>
    <rect class="subpanel" x="1108" y="310" width="156" height="86" rx="18"/>
    <rect class="subpanel" x="1278" y="310" width="156" height="86" rx="18"/>
    <rect class="subpanel" x="1448" y="310" width="84" height="86" rx="18"/>
    <text class="cardTitle" x="1130" y="250">MySQL</text>
    <text class="small" x="1130" y="274">business data</text>
    <text class="cardTitle" x="1300" y="250">Redis</text>
    <text class="small" x="1300" y="274">cache / session / task state</text>
    <text class="cardTitle" x="1466" y="250">Prom</text>
    <text class="small" x="1466" y="274">metrics</text>
    <text class="cardTitle" x="1130" y="340">Pushgateway</text>
    <text class="small" x="1130" y="364">task and agent push metrics</text>
    <text class="cardTitle" x="1300" y="340">Alertmanager</text>
    <text class="small" x="1300" y="364">optional alert hub</text>
    <text class="cardTitle" x="1466" y="340">Upload</text>
    <text class="small" x="1466" y="364">files / SSH</text>
  </g>

  <g id="domains">
    <rect class="panel" x="300" y="430" width="740" height="348" rx="30" filter="url(#shadow)"/>
    <rect x="300" y="430" width="740" height="8" rx="30" fill="#10b981"/>
    <text class="eyebrow" x="330" y="466">Business Domains</text>
    <text class="section" x="330" y="498">Shared Capability Surface</text>
    <text class="small" x="330" y="522">web/src/views + web/src/api map onto api/api/&lt;domain&gt; and api/router/&lt;domain&gt;</text>

    <rect class="subpanel" x="330" y="548" width="330" height="94" rx="20"/>
    <rect class="subpanel" x="680" y="548" width="330" height="94" rx="20"/>
    <rect class="subpanel" x="330" y="662" width="330" height="94" rx="20"/>
    <rect class="subpanel" x="680" y="662" width="330" height="94" rx="20"/>

    <text class="cardTitle" x="354" y="578">Governance &amp; Assets</text>
    <text class="body" x="354" y="604">system / cmdb / configCenter</text>
    <text class="small" x="354" y="626">menus, roles, hosts, DB assets, credentials</text>

    <text class="cardTitle" x="704" y="578">Delivery &amp; Jobs</text>
    <text class="body" x="704" y="604">app / work / task / tool</text>
    <text class="small" x="704" y="626">quick release, work orders, Ansible, deploy tools</text>

    <text class="cardTitle" x="354" y="692">Platform &amp; Observability</text>
    <text class="body" x="354" y="718">k8s / monitor</text>
    <text class="small" x="354" y="740">clusters, workloads, agents, alerts, SSL, dashboards</text>

    <text class="cardTitle" x="704" y="692">Knowledge &amp; AI</text>
    <text class="body" x="704" y="718">knowledge / search / ai</text>
    <text class="small" x="704" y="740">knowledge base, search, assistant, diagnosis, runtime</text>
  </g>

  <g id="managed">
    <rect class="panel" x="1080" y="460" width="480" height="318" rx="28" filter="url(#shadow)"/>
    <rect x="1080" y="460" width="480" height="8" rx="28" fill="#8b5cf6"/>
    <text class="eyebrow" x="1108" y="496">Managed Targets &amp; External Integrations</text>
    <text class="section" x="1108" y="528">Execution Side</text>

    <rect class="subpanel" x="1108" y="554" width="134" height="176" rx="20"/>
    <rect class="subpanel" x="1252" y="554" width="134" height="176" rx="20"/>
    <rect class="subpanel" x="1396" y="554" width="136" height="176" rx="20"/>

    <text class="cardTitle" x="1128" y="586">Hosts</text>
    <text class="body" x="1128" y="610">SSH / terminal</text>
    <text class="body" x="1128" y="632">Ansible jobs</text>
    <text class="small" x="1128" y="660">CMDB host ops, audits, scripts</text>

    <text class="cardTitle" x="1272" y="586">Kubernetes</text>
    <text class="body" x="1272" y="610">cluster API</text>
    <text class="body" x="1272" y="632">workloads / nodes</text>
    <text class="small" x="1272" y="660">kubectl, apply, ingress, storage</text>

    <text class="cardTitle" x="1416" y="586">AI Runtime</text>
    <text class="body" x="1416" y="610">OpenAI-compatible</text>
    <text class="body" x="1416" y="632">assistant / diagnosis</text>
    <text class="small" x="1416" y="660">LLM API over HTTP</text>
  </g>

  <path class="link" d="M 260 208 C 276 208 284 208 300 208"/>
  <text class="label" x="272" y="194">HTTPS</text>

  <path class="link" d="M 600 250 C 616 250 624 250 640 250"/>
  <text class="label" x="602" y="232">REST / SSE / WS</text>

  <path class="link" d="M 1040 248 C 1056 248 1064 248 1080 248"/>
  <text class="label" x="1048" y="228">DB / cache / metrics</text>

  <path class="link" d="M 450 382 C 450 404 450 410 450 430"/>
  <text class="label" x="468" y="412">routes + api facades</text>

  <path class="link" d="M 840 402 C 840 416 840 420 840 430"/>
  <text class="label" x="856" y="420">router -&gt; controller -&gt; service</text>

  <path class="link" d="M 1040 618 C 1056 618 1064 618 1080 618"/>
  <text class="label" x="914" y="604">SSH / K8s API / LLM API</text>

  <path class="link-dashed" d="M 260 402 C 280 402 288 372 320 372"/>
  <text class="label" x="272" y="388">static image / Nginx</text>

  <path class="link-dashed" d="M 260 440 C 300 440 320 430 640 430"/>
  <text class="label" x="272" y="426">API image / config / env</text>

  <rect x="300" y="824" width="1260" height="120" rx="24" fill="#ffffff" stroke="#dbe5f0" filter="url(#shadow)"/>
  <text class="eyebrow" x="330" y="860">Reading Guide</text>
  <text class="body" x="330" y="892">OpsNexus keeps a clear front-end to back-end split: Vue pages and API facades live in `web/`,</text>
  <text class="body" x="330" y="914">domain-layered Go services live in `api/`, and deployment entry points live in `docker/`, `deploy/helm/`, `k8s/`, and `deploy/systemd/`.</text>
  <text class="footer" x="330" y="936">Derived from README.md, api/router/router.go, web/src/router/router.js, docker/docker-compose.yml, deploy/helm/opsnexus/values.yaml</text>
</svg>
